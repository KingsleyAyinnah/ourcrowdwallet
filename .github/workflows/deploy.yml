name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to cPanel File Manager
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚡ Setup PHP & Install Composer Dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: 📦 Install Production Composer Packages
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🚀 Sync Files to cPanel via Secure FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_SERVER_DIR || 'public_html/' }}
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            scratch/**
            .env
            config/database.php
            config/gaps.php
            config/mail.php
            config/vtpass.php
            logs/**
            test_*.php
            README.md
